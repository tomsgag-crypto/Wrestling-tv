plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.ringchannel.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.ringchannel.app"
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName "2.1"
    }

    // One fixed key for every build, so new versions install as updates (the key is a GitHub secret, never in the code)
    signingConfigs {
        fixed {
            def ks = System.getenv('APK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away.
            signingConfig System.getenv('APK_KEYSTORE_FILE') ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
