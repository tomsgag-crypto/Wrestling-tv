<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Channels</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Roboto Condensed", Roboto, Arial, sans-serif; }

  /* the picture: full screen, original shape */
  .tvv.standby { visibility: hidden !important; }
  .tvv { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; object-fit: contain;
    transition: all .25s ease; z-index: 2; }
  body.guide .tvv { top: 2.5vh; left: auto; right: 2vw; width: 40vw; height: 22.5vw; border: 3px solid #ffd400;
    border-radius: 6px; }

  /* channel banner */
  #banner { position: absolute; top: 4vh; left: 3vw; max-width: 52vw; z-index: 5; background: rgba(10,26,122,.93);
    border: 2px solid #ffd400; border-radius: 10px; padding: 1.4vh 1.6vw 1.6vh; display: none; }
  #banner.show { display: block; }
  #bNum { font-size: 3.6vh; font-weight: 800; color: #ffd400; }
  #bName { font-size: 2.4vh; font-weight: 700; margin-top: .2vh; }
  #bNow { font-size: 2.2vh; color: #dde4ff; margin-top: .8vh; line-height: 1.35; }

  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; display: none;
    background: rgba(0,0,0,.8); padding: 1.4vh 2vw; border-radius: 8px; font-size: 2.6vh; font-weight: 700; text-align: center; }
  #status.show { display: block; }
  body.guide #status { top: calc(2.5vh + 11.25vw); left: auto; right: 22vw; transform: translate(50%, -50%); font-size: 2vh; }

  /* the guide */
  #guide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #1c0a10; z-index: 1; display: none; }
  body.guide #guide { display: block; }
  #gTop { height: calc(22.5vw + 5vh); padding: 2.5vh 2vw 1vh 2.5vw; width: 56vw; }
  #gBrand { font-size: 3.2vh; font-weight: 800; color: #ffd400; letter-spacing: .1vw; }
  #gClock { font-size: 2.2vh; font-weight: 700; margin-bottom: 1.4vh; }
  #iChan { font-size: 2.2vh; font-weight: 700; color: #7fe0ff; }
  #iTitle { font-size: 3.1vh; font-weight: 800; margin: .4vh 0; line-height: 1.2; }
  #iWhen { font-size: 2.2vh; color: #ffd400; }
  #gHead { display: flex; background: #5c0d1c; height: 4vh; line-height: 4vh; font-size: 1.8vh; font-weight: 800; color: #ffd400; }
  #gHead .gch { padding-left: 1.5vw; }
  #gTimes { position: relative; flex: 1; }
  .tick { position: absolute; top: 0; padding-left: .5vw; border-left: 1px solid rgba(255,212,0,.5); white-space: nowrap; }
  #rows { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .grow { display: flex; height: 6.4vh; border-bottom: 1px solid rgba(160,60,80,.4); }
  .gch { width: 20%; flex: none; padding: .6vh 0 0 1.5vw; overflow: hidden; }
  .grow.selrow .gch { background: #6a1626; }
  .gline { position: relative; flex: 1; overflow: hidden; }
  .blk { position: absolute; top: .4vh; bottom: .4vh; background: #3a1020; border: 1px solid #7a2236; border-radius: 4px;
    padding: .3vh .5vw; overflow: hidden; }
  .blk.now { background: #52142a; }
  .blk.gap { background: rgba(0,0,0,.25); border-color: rgba(160,60,80,.25); color: #a07880; }
  .blk.sel { background: #ffd400; color: #111; border-color: #fff; }
  .blk.sel .bl { color: #3a2c00; }
  .bt { font-size: 1.9vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bl { font-size: 1.5vh; color: #e8c8d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff3355; z-index: 2; }
  .num { font-size: 2.4vh; font-weight: 800; color: #ffd400; }
  .call { font-size: 1.6vh; font-weight: 700; color: #7fe0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .watch { color: #7fffa0; }

  /* "Back at …" card */
  #slate { position: absolute; inset: 0; top: 0; left: 0; right: 0; bottom: 0; z-index: 3; display: none; text-align: center;
    background: radial-gradient(#3a0c18, #0c0306); padding-top: 30vh; }
  #slate.show { display: block; }
  body.guide #slate { top: 2.5vh; left: auto; right: 2vw; width: 40vw; height: 22.5vw; padding-top: 5vw; border: 3px solid #ffd400; }
  .sCh { font-size: 3vh; font-weight: 800; color: #7fe0ff; }
  .sBig { font-size: 7vh; font-weight: 800; color: #ffd400; margin: 1vh 0; }
  .sNext { font-size: 2.8vh; }
  .sHint { font-size: 2vh; color: #d0a8b0; margin-top: 3vh; }
  body.guide #slate .sBig { font-size: 3.5vh; } body.guide #slate .sNext, body.guide #slate .sHint { font-size: 1.6vh; }

  /* phone, held upright */
  @media (max-aspect-ratio: 1/1) {
    body.guide .tvv { width: 46vw; height: 25.9vw; }
    #gTop { width: 50vw; height: calc(25.9vw + 5vh); }
    .gch { width: 26%; }
  }
</style>
</head>
<body>
  <video id="v" class="tvv" playsinline preload="auto"></video>
  <video class="tvv standby" playsinline muted preload="auto"></video>
  <video class="tvv standby" playsinline muted preload="auto"></video>
  <div id="banner"><div id="bNum"></div><div id="bName"></div><div id="bNow"></div></div>
  <div id="status"></div>
  <div id="slate"></div>
  <div id="guide">
    <div id="gTop">
      <div id="gBrand">MOVIE CHANNELS</div>
      <div id="gClock"></div>
      <div id="iChan"></div>
      <div id="iTitle"></div>
      <div id="iWhen"></div>
    </div>
    <div id="gHead"><div class="gch">CHANNEL</div><div id="gTimes"></div></div>
    <div id="rows"></div>
  </div>
  <script src="movies.js"></script>
  <script src="channels.js"></script>
</body>
</html>
