plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.moviechannels.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.moviechannels.app"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // One fixed key for every build, so new versions install as updates (the key is a GitHub secret, never in the code)
    signingConfigs {
        fixed {
            def ks = System.getenv('APK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('APK_KEYSTORE_FILE') ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
