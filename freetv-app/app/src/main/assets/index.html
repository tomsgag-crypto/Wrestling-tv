<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Free TV</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1a; color: #eef1f8;
    font-family: Roboto, 'Segoe UI', Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  #top { display: flex; align-items: center; gap: 1vw; padding: 1.6vh 2.4vw 1.2vh; background: #111829; border-bottom: 3px solid #19c37d; }
  #logo { font-weight: 900; font-size: 3.2vh; letter-spacing: .1vw; color: #19c37d; white-space: nowrap; margin-right: 1.4vw; }
  .tab { padding: .8vh 1.4vw; border-radius: 8px; font-size: 2.3vh; font-weight: 700; color: #8f9bb8; white-space: nowrap; }
  .tab.on { color: #fff; background: #1f2a44; }
  .zone-tabs .tab.on { background: #19c37d; color: #06140d; }
  #clock { margin-left: auto; font-size: 2.2vh; color: #8f9bb8; white-space: nowrap; }
  #main { position: absolute; top: 8.4vh; left: 0; right: 0; bottom: 4.6vh; }
  #help { position: absolute; left: 0; right: 0; bottom: 0; height: 4.6vh; line-height: 4.6vh; padding: 0 2.4vw; font-size: 1.7vh;
    color: #8f9bb8; background: #0f1524; border-top: 1px solid #1f2a44; white-space: nowrap; overflow: hidden; }
  #help b { color: #eef1f8; }
  .view { position: absolute; inset: 0; display: none; }
  .view.show { display: block; }

  /* ---------------- guide ---------------- */
  #gInfo { height: 17vh; padding: 1.6vh 2.4vw 0; display: flex; gap: 2vw; }
  #gImg { width: 26vh; height: 14.6vh; border-radius: 8px; background: #1f2a44 center/cover no-repeat; flex: none; }
  #gText { flex: 1; overflow: hidden; }
  #gChan { font-size: 1.9vh; font-weight: 700; color: #19c37d; }
  #gTitle { font-size: 3vh; font-weight: 800; margin: .3vh 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gWhen { font-size: 1.9vh; color: #ffcf33; }
  #gDesc { font-size: 1.8vh; color: #b9c2d8; margin-top: .5vh; max-height: 5vh; overflow: hidden; }
  #gHead { display: flex; height: 3.6vh; line-height: 3.6vh; background: #142039; font-size: 1.7vh; font-weight: 800; color: #ffcf33; }
  #gHead .gch { padding-left: 1.5vw; }
  #gTimes { position: relative; flex: 1; }
  .tick { position: absolute; top: 0; padding-left: .5vw; border-left: 1px solid rgba(255,207,51,.45); white-space: nowrap; }
  #rows { position: absolute; left: 0; right: 0; top: 20.6vh; bottom: 0; overflow: hidden; }
  .grow { display: flex; height: 6.2vh; border-bottom: 1px solid #1a2440; }
  .gsec { height: 3.2vh; line-height: 3.2vh; padding-left: 1.5vw; font-size: 1.5vh; font-weight: 800; letter-spacing: .15vw; color: #19c37d; background: #0e1527; text-transform: uppercase; }
  .gch { width: 19%; flex: none; padding: .5vh 0 0 1.5vw; overflow: hidden; }
  .grow.selrow .gch { background: #1b2a4a; }
  .gch .nm { font-size: 1.9vh; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gch .fv { color: #ff4d6d; }
  .gch .sv { font-size: 1.4vh; color: #8f9bb8; white-space: nowrap; }
  .gch .sv.no { color: #6b5560; }
  .gline { position: relative; flex: 1; overflow: hidden; }
  .blk { position: absolute; top: .4vh; bottom: .4vh; background: #17213a; border: 1px solid #2a3a63; border-radius: 4px; padding: .3vh .5vw; overflow: hidden; }
  .blk.now { background: #1d2b4d; }
  .blk.sel { background: #ffcf33; color: #111; border-color: #fff; }
  .blk.sel .bl { color: #4a3b00; }
  .blk.listed::after { content: '★'; position: absolute; right: .4vw; top: .2vh; color: #19c37d; font-size: 1.6vh; }
  .blk.sel.listed::after { color: #0a5a37; }
  .bt { font-size: 1.8vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bl { font-size: 1.4vh; color: #b9c2d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tNav { position: absolute; right: .6vw; top: 0; display: flex; gap: 1.6vw; background: #142039; padding-left: 1vw; }
  #tNav span { color: #19c37d; font-weight: 900; padding: 0 1vw; cursor: pointer; }
  body.touch #rows { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  body.touch #gHead { height: 4.4vh; line-height: 4.4vh; font-size: 1.6vh; }
  .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4d6d; z-index: 2; }

  /* ---------------- two-panel lists ---------------- */
  .cols { position: absolute; inset: 0; display: flex; }
  .left { width: 30%; border-right: 1px solid #1f2a44; overflow: hidden; position: relative; }
  .right { flex: 1; overflow: hidden; position: relative; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 1vh 0; }
  .cat { padding: 1.1vh 1.6vw; font-size: 2.1vh; display: flex; justify-content: space-between; gap: 1vw; color: #c9d1e6; white-space: nowrap; }
  .cat .n { color: #6f7b98; font-size: 1.7vh; }
  .cat.chip { margin: .4vh 1vw 1vh; border: 2px solid #19c37d; border-radius: 8px; color: #19c37d; font-weight: 800; position: sticky; top: 0; z-index: 2; background: #0b0f1a; }
  .cat.chip.sel { background: #19c37d; }
  .cat.chip.sel { color: #06140d; }
  .cat.hdr { font-size: 1.5vh; font-weight: 800; letter-spacing: .15vw; color: #19c37d; text-transform: uppercase; padding-top: 1.8vh; }
  .cat.sel { background: #1f2a44; color: #fff; }
  .focus-left .cat.sel { background: #19c37d; color: #06140d; }
  .focus-left .cat.sel .n { color: #0a3d26; }
  .item { display: flex; gap: 1.4vw; padding: 1vh 1.6vw; align-items: center; border-left: 4px solid transparent; }
  .item .im { width: 16vh; height: 9vh; flex: none; border-radius: 6px; background: #1f2a44 center/cover no-repeat; }
  .item .tx { flex: 1; overflow: hidden; }
  .item .t { font-size: 2.1vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 1.6vh; color: #9aa5c1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .3vh; }
  .item .d { font-size: 1.6vh; color: #b9c2d8; max-height: 4.4vh; overflow: hidden; margin-top: .3vh; }
  .badge { display: inline-block; font-size: 1.3vh; font-weight: 800; padding: .1vh .5vw; border-radius: 4px; margin-right: .5vw; background: #2a3a63; color: #dfe6f7; }
  .badge.bbc { background: #e6007e; color: #fff; } .badge.pluto { background: #fff200; color: #111; } .badge.itv { background: #00e0b5; color: #111; }
  .badge.c4 { background: #b4b4b4; color: #111; } .badge.five { background: #9b6cff; color: #fff; } .badge.u { background: #ff7a00; color: #111; }
  .badge.tv { background: #ffcf33; color: #111; }
  .item.sel { background: #1f2a44; border-left-color: #19c37d; }
  .focus-right .item.sel { background: #ffcf33; color: #111; border-left-color: #fff; }
  .focus-right .item.sel .s, .focus-right .item.sel .d { color: #3d3200; }
  .item.star .t::after { content: ' ★'; color: #19c37d; }
  .empty { padding: 6vh 3vw; text-align: center; color: #8f9bb8; font-size: 2.2vh; line-height: 1.6; }
  .spinner { display: inline-block; width: 2.2vh; height: 2.2vh; border: .35vh solid #2a3a63; border-top-color: #19c37d; border-radius: 50%;
    animation: sp 1s linear infinite; vertical-align: middle; margin-right: 1vw; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---------------- apps ---------------- */
  #appsGrid { display: flex; flex-wrap: wrap; gap: 1.6vh 1.4vw; padding: 2.4vh 2.4vw; }
  .app { width: 17vw; height: 15vh; border-radius: 12px; background: #17213a; border: 2px solid #23315a; padding: 1.6vh 1vw; position: relative; }
  .app .an { font-size: 2.4vh; font-weight: 800; }
  .app .ad { font-size: 1.5vh; color: #9aa5c1; margin-top: .6vh; line-height: 1.35; }
  .app .st { position: absolute; bottom: 1.2vh; left: 1vw; font-size: 1.5vh; font-weight: 700; color: #19c37d; }
  .app .st.no { color: #ffb020; }
  .app.sel { border-color: #ffcf33; background: #22305a; transform: scale(1.04); }
  .setting { width: 35.6vw; height: auto; min-height: 9vh; }
  .setting .an { font-size: 2vh; }

  /* ---------------- search ---------------- */
  #qbox { padding: 2vh 2.4vw 1vh; }
  #q { width: 100%; font-size: 2.8vh; padding: 1.2vh 1.2vw; border-radius: 8px; border: 2px solid #2a3a63; background: #121a2e; color: #fff; outline: none; }
  #q.sel { border-color: #ffcf33; }
  #sres { position: absolute; left: 0; right: 0; top: 10vh; bottom: 0; }

  /* ---------------- pop-up menu ---------------- */
  #pop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 20; }
  #pop.show { display: flex; align-items: center; justify-content: center; }
  #popBox { width: 44vw; max-height: 80vh; overflow: hidden; background: #141d33; border: 2px solid #19c37d; border-radius: 14px; padding: 2vh 0; }
  #popTitle { font-size: 2.4vh; font-weight: 800; padding: 0 2vw 1.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt { padding: 1.2vh 2vw; font-size: 2.2vh; }
  .opt.sel { background: #ffcf33; color: #111; font-weight: 700; }
  .opt .tick2 { color: #19c37d; float: right; }
  .opt.sel .tick2 { color: #0a5a37; }
  #popIn { display: none; margin: 0 2vw 1vh; width: calc(100% - 4vw); font-size: 2.4vh; padding: 1vh 1vw; border-radius: 8px; border: 2px solid #ffcf33; background: #0f1628; color: #fff; outline: none; }

  /* phone */
  body.touch #top { flex-wrap: wrap; padding: 1vh 2vw; gap: .5vw; }
  body.touch #logo { font-size: 2.2vh; width: 100%; }
  body.touch .tab { font-size: 1.8vh; padding: .6vh 2vw; }
  body.touch #clock { display: none; }
  body.touch #main { top: 11vh; bottom: 0; }
  body.touch #help { display: none; }
  @media (orientation: portrait) {
    .cols { flex-direction: column; }
    .left { width: 100%; height: 30%; border-right: 0; border-bottom: 1px solid #1f2a44; }
    .gch { width: 28%; }
    #gInfo { height: 15vh; }
    #rows { top: 19.4vh; }
    #gImg { display: none; }
    .app { width: 44vw; }
    .setting { width: 92vw; }
    #popBox { width: 90vw; }
  }
</style>
</head>
<body>
  <div id="top">
    <div id="logo">FREE TV</div>
    <div class="tab" data-v="guide">TV Guide</div>
    <div class="tab" data-v="ondemand">On Demand</div>
    <div class="tab" data-v="lists">My Lists</div>
    <div class="tab" data-v="search">Search</div>
    <div class="tab" data-v="apps">Apps</div>
    <div id="clock"></div>
  </div>
  <div id="main">
    <div class="view" id="v-guide">
      <div id="gInfo"><div id="gImg"></div><div id="gText"><div id="gChan"></div><div id="gTitle"></div><div id="gWhen"></div><div id="gDesc"></div></div></div>
      <div id="gHead"><div class="gch">CHANNEL</div><div id="gTimes"></div></div>
      <div id="rows"></div>
    </div>
    <div class="view" id="v-ondemand"><div class="cols"><div class="left"><div class="scroll" id="odCats"></div></div><div class="right"><div class="scroll" id="odItems"></div></div></div></div>
    <div class="view" id="v-lists"><div class="cols"><div class="left"><div class="scroll" id="lsCats"></div></div><div class="right"><div class="scroll" id="lsItems"></div></div></div></div>
    <div class="view" id="v-search"><div id="qbox"><input id="q" placeholder="Search programmes and films…" autocomplete="off"></div><div id="sres"><div class="scroll" id="sItems"></div></div></div>
    <div class="view" id="v-apps"><div class="scroll"><div id="appsGrid"></div></div></div>
  </div>
  <div id="help"></div>
  <div id="pop"><div id="popBox"><div id="popTitle"></div><input id="popIn" autocomplete="off"><div id="popOpts"></div></div></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
