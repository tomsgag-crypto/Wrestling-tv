plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.freetvguide.app'
    compileSdk 35

    defaultConfig {
        applicationId "tv.freetvguide.app"
        minSdk 21
        targetSdk 34
        versionCode 155
        versionName "2.34.5"
    }

    // One fixed key for every build, so new versions install as updates (the key is a GitHub secret, never in the code)
    signingConfigs {
        fixed {
            def ks = System.getenv('APK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // Two apps from the same code: Free TV, and a Sky Sports-only guide
    buildFeatures { buildConfig true }
    flavorDimensions "app"
    productFlavors {
        full {
            dimension "app"
            resValue "string", "app_name", "Free TV"
            buildConfigField "String", "UPDATE_URL", '"https://github.com/tomsgag-crypto/Wrestling-tv/releases/download/free-tv/FreeTV.apk"'
        }
        sports {
            dimension "app"
            applicationId "tv.freetvguide.sports"
            resValue "string", "app_name", "Sky Sports TV"
            buildConfigField "String", "UPDATE_URL", '"https://github.com/tomsgag-crypto/Wrestling-tv/releases/download/sky-sports-tv/SkySportsTV.apk"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('APK_KEYSTORE_FILE') ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
