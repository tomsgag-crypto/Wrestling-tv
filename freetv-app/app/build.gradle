plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.freetvguide.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.freetvguide.app"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "2.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
