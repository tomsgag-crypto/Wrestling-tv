plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.wrestlingarchive.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.wrestlingarchive.app"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    // One fixed key for every build, so new versions install as updates (the key is a GitHub secret, never in the code)
    signingConfigs {
        fixed {
            def ks = System.getenv('APK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('APK_KEYSTORE_FILE') ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-cast:1.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
}
