name: Probe Archive data
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe.js', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe.js
      - run: |
          cd probe && gzip -9 *.json && cd ..
          git config user.name "tomsgag-crypto"; git config user.email "tomsgag-crypto@users.noreply.github.com"
          git checkout --orphan probe-data && git rm -rq --cached . && git add -f probe && git commit -qm "probe data" && git push -f origin probe-data
