name: purchases-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/purchases_sort_test.js
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
