name: Build Wrestling Archive APK

on:
  push:
    paths:
      - 'archive-app/**'
      - '.github/workflows/build-archive-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use the fixed signing key (so new versions install as updates)
        env:
          KEY: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/apps.keystore" && echo "APK_KEYSTORE_FILE=$RUNNER_TEMP/apps.keystore" >> "$GITHUB_ENV" && echo "fixed key in use"; else echo "no APK_KEYSTORE secret: using a throwaway key"; fi
      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../WrestlingArchive.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wrestling-archive
          name: Wrestling Archive (latest build)
          body: Built from commit ${{ github.sha }}
          files: WrestlingArchive.apk
          make_latest: false
