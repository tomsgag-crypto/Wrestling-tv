name: Build Free TV APK

on:
  push:
    paths:
      - 'freetv-app/**'
      - '.github/workflows/build-free-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freetv-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Add the TMDB key (stored as a repository secret, never in the code)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: echo "window.TMDB_KEY = '${TMDB_KEY}';" > app/src/main/assets/config.js

      - name: Use the fixed signing key (so new versions install as updates)
        env:
          KEY: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/apps.keystore" && echo "APK_KEYSTORE_FILE=$RUNNER_TEMP/apps.keystore" >> "$GITHUB_ENV" && echo "fixed key in use"; else echo "no APK_KEYSTORE secret: using a throwaway key"; fi
      - name: Count the films in "All Movies A–Z" (My Purchases check)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$YT_API_KEY" ]; then echo "MY PURCHASES: no YT_API_KEY secret yet"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          key = os.environ["YT_API_KEY"]; tok = ""; films = 0; skipped = 0; pages = 0
          while True:
              u = "https://www.googleapis.com/youtube/v3/playlistItems?" + urllib.parse.urlencode({"part": "snippet,contentDetails", "maxResults": 50, "playlistId": "PLayBy19w9yIU", "key": key, "pageToken": tok})
              try: j = json.loads(urllib.request.urlopen(u, timeout=60).read())
              except Exception as e: print("MY PURCHASES: YouTube error", getattr(e, "code", ""), getattr(e, "read", lambda: b"")()[:300]); break
              pages += 1
              for it in j.get("items", []):
                  t = it["snippet"]["title"]
                  if t.lower() in ("private video", "deleted video"): skipped += 1
                  else: films += 1
              tok = j.get("nextPageToken")
              if not tok: break
          print("MY PURCHASES: %d films (%d private/deleted skipped) in %d pages, playlist says %s" % (films, skipped, pages, j.get("pageInfo", {}).get("totalResults")))
          PY

      - name: Build APKs (Free TV and Sky Sports TV)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: gradle assembleFullRelease assembleSportsRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk ../FreeTV.apk
          cp app/build/outputs/apk/sports/release/app-sports-release.apk ../SkySportsTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: free-tv
          name: Free TV (latest build)
          body: Built from commit ${{ github.sha }}
          files: FreeTV.apk
          make_latest: false

      - name: Publish Sky Sports TV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sky-sports-tv
          name: Sky Sports TV (latest build)
          body: Built from commit ${{ github.sha }}
          files: SkySportsTV.apk
          make_latest: false
