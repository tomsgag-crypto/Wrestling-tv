name: Build movie catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths: ['tools/build-movies.js', 'shared/movies.js', '.github/workflows/build-movie-data.yml']
permissions:
  contents: write
concurrency: { group: movie-data, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-movies.js
      - name: Publish to the movie-data branch
        run: |
          mkdir pub && cp out/movies.json pub/ && cd pub
          git init -q -b movie-data && git config user.name "tomsgag-crypto" && git config user.email "tomsgag-crypto@users.noreply.github.com"
          git add movies.json && git commit -qm "Movie catalogue $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" movie-data
