name: Build APK

on:
  push:
    paths-ignore:
      - 'archive-app/**'
      - 'cartoon-app/**'
      - 'channels-app/**'
      - 'movie-channels-app/**'
      - 'movie-archive-app/**'
      - 'freetv-app/**'
      - '.github/workflows/build-free-tv.yml'
      - 'shared/**'
      - 'tools/**'
      - '.github/workflows/build-movie-*.yml'
      - '.github/workflows/probe.yml'
      - '.github/workflows/build-tv-data.yml'
      - '.github/workflows/build-movie-data.yml'
      - '.github/workflows/build-channels-app.yml'
      - '.github/workflows/build-cartoon-app.yml'
      - '.github/workflows/build-archive-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use the fixed signing key (so new versions install as updates)
        env:
          KEY: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/apps.keystore" && echo "APK_KEYSTORE_FILE=$RUNNER_TEMP/apps.keystore" >> "$GITHUB_ENV" && echo "fixed key in use"; else echo "no APK_KEYSTORE secret: using a throwaway key"; fi
      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RingChannelTV-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RingChannelTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ring Channel TV v1.0.${{ github.run_number }}
          files: RingChannelTV.apk
          make_latest: true
