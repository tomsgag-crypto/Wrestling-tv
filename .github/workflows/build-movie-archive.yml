name: Build Movie Archive APK

on:
  push:
    paths:
      - 'movie-archive-app/**'
      - 'shared/**'
      - '.github/workflows/build-movie-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-archive-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use the shared movie rules
        run: cp ../shared/movies.js app/src/main/assets/movies.js

      - name: Use the fixed signing key (so new versions install as updates)
        env:
          KEY: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then mkdir -p ~/.android && echo "$KEY" | base64 -d > ~/.android/debug.keystore && echo "fixed key in use"; else echo "no APK_KEYSTORE secret: using a throwaway key"; fi
      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../MovieArchive.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: movie-archive
          name: Movie Archive (latest build)
          body: Built from commit ${{ github.sha }}
          files: MovieArchive.apk
          make_latest: false
