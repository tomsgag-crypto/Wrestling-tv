name: Build Cartoon Archive APK

on:
  push:
    paths:
      - 'cartoon-app/**'
      - '.github/workflows/build-cartoon-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartoon-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../CartoonArchive.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cartoon-archive
          name: Cartoon Archive (latest build)
          body: Built from commit ${{ github.sha }}
          files: CartoonArchive.apk
          make_latest: false
